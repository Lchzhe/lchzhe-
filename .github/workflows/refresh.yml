name: Refresh macro and A-share source status
on:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "0 12 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Fetch public source status and write report
        run: python scripts/refresh-data.py
      - name: Commit refreshed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-status.json data/news.json reports/
          git diff --cached --quiet || git commit -m "Refresh source status and daily report"
          git push

