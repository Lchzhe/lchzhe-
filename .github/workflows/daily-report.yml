name: Build daily finance report
on:
  schedule:
    - cron: "59 15 * * *"
  workflow_dispatch:
    inputs:
      report_date:
        description: "可选：手动测试时指定报告日期（YYYY-MM-DD）"
        required: false
        type: string
permissions:
  contents: write
concurrency:
  group: daily-finance-report
  cancel-in-progress: false
jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Refresh final public snapshots
        run: python scripts/refresh-data.py
      - name: Build full daily report
        env:
          REPORT_DATE: ${{ inputs.report_date }}
        run: |
          if [ -n "$REPORT_DATE" ]; then
            python scripts/build-daily-report.py --date "$REPORT_DATE"
          else
            REPORT_DATE=$(TZ=Asia/Shanghai date +%F)
            python scripts/build-daily-report.py --date "$REPORT_DATE"
          fi
      - name: Commit report and snapshots
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/source-status.json data/news.json data/market.json data/market-history.json reports/
          git diff --cached --quiet || git commit -m "Build daily finance report"
          git push

